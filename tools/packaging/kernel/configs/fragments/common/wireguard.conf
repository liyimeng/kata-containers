# WireGuard
#
# Enables the in-kernel WireGuard VPN so that mesh/VPN agents (e.g. NetBird,
# Tailscale, wg-quick) running inside the kata guest VM can use the kernel
# data path instead of falling back to the userspace wireguard-go
# implementation, which costs more memory and CPU per packet.
#
CONFIG_WIREGUARD=y
